<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}
.box {
    width: 100%;
    max-width: 620px;
    background: #1e293b;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border: 1px solid #334155;
}
.device-img {
    display: block;
    margin: 0 auto 15px;
    max-width: 180px;
    height: auto;
    filter: drop-shadow(0 8px 16px rgba(56,189,248,0.3));
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 8px; }
.sub { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
.upload {
    border: 2px dashed #38bdf8;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    background: #0f172a;
    transition: 0.2s;
}
.upload:hover { background: #1e293b; border-color: #22c55e; }
.upload .icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
input[type=file] { display: none; }
.loading { text-align: center; color: #38bdf8; margin-top: 20px; display: none; }
.result { display: none; margin-top: 20px; }
.card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}
.card .title {
    color: #38bdf8;
    font-size: 0.95rem;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #334155;
    font-weight: bold;
}
.line {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.95rem;
    gap: 10px;
}
.line .k { color: #94a3b8; flex-shrink: 0; }
.line .v { color: #fff; font-weight: bold; text-align: left; direction: ltr; word-break: break-all; }
.good { color: #22c55e !important; }
.bad { color: #ef4444 !important; }
.warn { color: #f59e0b !important; }
.info { color: #38bdf8 !important; }
.verdict {
    display: none;
    margin-top: 15px;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: bold;
    border: 2px solid;
    line-height: 1.7;
}
.v-original { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
.v-good-clone { background: rgba(56,189,248,0.1); border-color: #38bdf8; color: #38bdf8; }
.v-bad-clone { background: rgba(239,68,68,0.1); border-color: #ef4444; color: #ef4444; }
.err { display: none; color: #ef4444; text-align: center; margin-top: 15px; font-weight: bold; }
.developer {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #334155;
    text-align: center;
}
.developer p {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 10px;
}
.fb-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1877f2;
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.9rem;
    transition: 0.2s;
}
.fb-link:hover {
    background: #0e5fd8;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(24,119,242,0.4);
}
.fb-link svg { width: 18px; height: 18px; fill: #fff; }
</style>
</head>

            <div class="line"><span class="k">السوفت:</span><span class="v" id="vOS">-</span></div>

            <div class="title">🔎 تفاصيل فنية</div>
